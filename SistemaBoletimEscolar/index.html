
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Notas Escolares</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Sistema de Notas Escolares</h1>

        <label>Nome do Aluno:</label>
        <input type="text" id="nome" placeholder="Digite o nome">

        <label>Nota 1:</label>
        <input type="number" id="nota1" min="0" max="10" step="0.1">

        <label>Nota 2:</label>
        <input type="number" id="nota2" min="0" max="10" step="0.1">

        <label>Nota 3:</label>
        <input type="number" id="nota3" min="0" max="10" step="0.1">

        <button onclick="calcularMedia()">Calcular Média</button>

        <div id="resultado"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
