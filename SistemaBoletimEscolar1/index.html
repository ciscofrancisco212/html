
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sistema de Notas Escolares</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>📚 Sistema de Notas Escolares</h1>

        <label for="data">Data:</label>
        <input type="date" id="data">

        <label for="nome">Nome do Aluno:</label>
        <input type="text" id="nome" placeholder="Digite o nome do aluno">

        <label for="nota1">Nota 1:</label>
        <input type="number" id="nota1" min="0" max="10" step="0.1">

        <label for="nota2">Nota 2:</label>
        <input type="number" id="nota2" min="0" max="10" step="0.1">

        <label for="nota3">Nota 3:</label>
        <input type="number" id="nota3" min="0" max="10" step="0.1">

        <div class="botoes">

            <button onclick="cadastrarAluno()" class="btn-cadastrar">
                ➕ Cadastrar Aluno
            </button>

            <button onclick="novoAluno()" class="btn-novo">
                📝 Novo Aluno
            </button>

            <button onclick="limparRegistros()" class="btn-limpar">
                🗑️ Limpar Registros
            </button>

            <button onclick="imprimirLista()" class="btn-imprimir">
                🖨️ Imprimir Lista Final
            </button>

        </div>

        <h2>Lista de Alunos</h2>

        <div class="tabela-container">

            <table id="tabelaAlunos">

                <thead>
                    <tr>
                        <th>Data</th>
                        <th>Aluno</th>
                        <th>Nota 1</th>
                        <th>Nota 2</th>
                        <th>Nota 3</th>
                        <th>Média</th>
                        <th>Situação</th>
                    </tr>
                </thead>

                <tbody id="listaAlunos">
                </tbody>

            </table>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
