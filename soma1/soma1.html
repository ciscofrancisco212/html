<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="calculator.ico" type="image/x-icon">


    <title>Soma Simples</title>
    <!-- Vinculando o arquivo CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h2>Operação Somar</h2>
        
        <div class="input-group">
            <input type="number" id="numero1" placeholder="Digite o primeiro número">
            <span>+</span>
            <input type="number" id="numero2" placeholder="Digite o segundo número">
        </div>

        <div class="button-group">
            <button class="btn-somar" onclick="somar()">Somar</button>
            <button class="btn-limpar" onclick="limpar()">Limpar</button>
        </div>

        <div class="resultado">
            Resultado: <span id="resultado">0</span>
        </div>
    </div>

    <!-- Vinculando o arquivo JavaScript -->
    <script src="script.js"></script>
</body>
</html>
