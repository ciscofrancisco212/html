<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de IMC</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Calculadora de IMC</h1>
        <p class="subtitulo">Índice de Massa Corporal</p>

        <div class="formulario">

            <label for="sexo">Sexo:</label>

            <select id="sexo">
                <option value="">Selecione</option>
                <option value="Masculino">Masculino</option>
                <option value="Feminino">Feminino</option>
            </select>

            <label for="peso">Peso (kg):</label>
            <input type="number" id="peso" placeholder="Ex.: 75" step="0.1">

            <label for="altura">Altura (m):</label>
            <input type="number" id="altura" placeholder="Ex.: 1.75" step="0.01">

            <button onclick="calcularIMC()">Calcular IMC</button>

            <button class="limpar" onclick="limparCampos()">
                Limpar
            </button>

        </div>

        <div id="resultado" class="resultado"></div>

        <div class="tabela">

            <h2>Classificação</h2>

            <table>
                <thead>
                    <tr>
                        <th>IMC</th>
                        <th>Classificação</th>
                    </tr>
                </thead>

                <tbody>
                    <tr>
                        <td>Menor que 18,5</td>
                        <td>Abaixo do peso</td>
                    </tr>

                    <tr>
                        <td>18,5 a 24,9</td>
                        <td>Normal</td>
                    </tr>

                    <tr>
                        <td>25,0 a 29,9</td>
                        <td>Sobrepeso</td>
                    </tr>

                    <tr>
                        <td>30,0 a 39,9</td>
                        <td>Obeso</td>
                    </tr>

                    <tr>
                        <td>40,0 ou mais</td>
                        <td>Obesidade mórbida</td>
                    </tr>
                </tbody>
            </table>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
