<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tocador de Música</title>
    <!-- Vinculando o arquivo CSS externo -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card-player">
        <div class="capa-album">
            <!-- Imagem ilustrativa para a capa do áudio -->
            <img src="Bee Gees.jpg" alt="Capa do Álbum">
        </div>

        <div class="info-musica">
            <h2>Título da Música</h2>
            <p>Bee Gees</p>
        </div>

        <!-- Tag de Áudio do HTML5 -->
        <audio controls class="audio-player">
            <source src="StayinAlive.mp3" type="audio/mpeg">
            Seu navegador não suporta o elemento de áudio.
        </audio>
    </div>

</body>
</html>
