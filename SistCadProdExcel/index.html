
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Cadastro de Produtos</title>
    <link rel="stylesheet" href="style.css">

    <!-- Biblioteca para trabalhar com Excel e CSV -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
</head>
<body>

<div class="container">
    <header>
        <h1>📦 Cadastro de Produtos</h1>
        <p>Importação e gerenciamento de planilhas Excel e CSV</p>
    </header>

    <section class="painel">
        <h2>Importar banco de dados</h2>

        <label for="arquivo">Selecione sua planilha Excel ou CSV:</label>
        <input type="file" id="arquivo"
               accept=".xlsx,.xls,.csv">

        <div class="botoes">
            <button type="button" id="btnImportar">
                📂 Importar planilha
            </button>

            <button type="button" id="btnExportar">
                📥 Exportar Excel
            </button>

            <button type="button" id="btnImprimir">
                🖨️ Imprimir
            </button>
        </div>

        <p id="mensagem" role="status"></p>
    </section>

    <section class="painel">
        <h2>Cadastrar produto</h2>

        <form id="formProduto">
            <div id="camposFormulario" class="form-grid"></div>

            <div class="botoes">
                <button type="submit" id="btnSalvar">
                    💾 Salvar produto
                </button>

                <button type="button" id="btnCancelar"
                        class="secundario" hidden>
                    Cancelar edição
                </button>
            </div>
        </form>
    </section>

    <section class="painel">
        <h2>Produtos cadastrados</h2>

        <div class="resumo">
            <strong>Total de produtos: <span id="total">0</span></strong>
        </div>

        <input type="search" id="pesquisa"
               placeholder="🔎 Pesquisar produtos...">

        <div class="tabela-container">
            <table id="tabelaProdutos">
                <thead></thead>
                <tbody></tbody>
            </table>
        </div>
    </section>
</div>

<script src="script.js"></script>
</body>
</html>
