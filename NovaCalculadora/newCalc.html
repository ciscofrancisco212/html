<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora BÁSICA</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="container">
    <h2>Calculadora</h2>

    <form id="calcForm">
      <div class="input-group">
        <label for="num1">Primeiro número</label>
        <input type="number" id="num1" step="any" placeholder="Ex: 10" required>
      </div>

      <div class="input-group">
        <label for="num2">Segundo número</label>
        <input type="number" id="num2" step="any" placeholder="Ex: 5" required>
      </div>

      <div class="actions-grid">
        <button type="button" class="btn-op" data-op="add">+</button>
        <button type="button" class="btn-op" data-op="subtract">−</button>
        <button type="button" class="btn-op" data-op="multiply">×</button>
        <button type="button" class="btn-op" data-op="divide">÷</button>
      </div>

      <button type="button" id="btnClear" class="btn-clear">Limpar Calculadora</button>
    </form>

    <div id="resultBox" class="result-box hidden">
      <span id="resultLabel">Resultado:</span>
      <strong id="resultValue">0</strong>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
