<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Controle de Estacionamento</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Estacionamento</h1>
    
    <form id="form-estacionamento">
      <input type="text" id="placa" placeholder="Placa do veículo" required maxlength="8">
      <input type="text" id="modelo" placeholder="Modelo do veículo" required>
      <button type="submit">Entrar</button>
    </form>

    <h2>Veículos no Pátio</h2>
    <table>
      <thead>
        <tr>
          <th>Modelo</th>
          <th>Placa</th>
          <th>Entrada</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody id="lista-veiculos"></tbody>
    </table>

    <h2 class="titulo-historico">Histórico de Saídas</h2>
    <table>
      <thead>
        <tr>
          <th>Modelo</th>
          <th>Placa</th>
          <th>Entrada</th>
          <th>Saída</th>
          <th>Permanência</th>
        </tr>
      </thead>
      <tbody id="lista-historico"></tbody>
    </table>
  </div>

  <script src="script.js"></script>
</body>
</html>
